schema-version: "1.1"
build:
  name: OpenSearch
  version: 2.19.1
  qualifier: ee1
ci:
  image:
    name: opensearchstaging/ci-runner:ci-runner-al2-opensearch-build-v1
    args: -e JAVA_HOME=/opt/java/openjdk-21
components:
  - name: OpenSearch
    repository: https://github.com/eliatra-opensearch-enterprise-distro/OpenSearch.git
    ref: 2.19.x-ee
  # eliatra plugins
  - name: cloud-lock
    repository: https://github.com/eliatra-opensearch-enterprise-distro/cloud-lock.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    checks:
      - gradle:properties:version
      - gradle:dependencies:opensearch.version
  - name: common-utils
    repository: https://github.com/eliatra-opensearch-enterprise-distro/common-utils.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: opensearch-learning-to-rank-base
    repository: https://github.com/eliatra-opensearch-enterprise-distro/opensearch-learning-to-rank-base.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: opensearch-remote-metadata-sdk
    repository: https://github.com/eliatra-opensearch-enterprise-distro/opensearch-remote-metadata-sdk.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: job-scheduler
    repository: https://github.com/eliatra-opensearch-enterprise-distro/job-scheduler.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: security
    repository: https://github.com/eliatra-opensearch-enterprise-distro/security.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: k-NN
    repository: https://github.com/eliatra-opensearch-enterprise-distro/k-NN.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: geospatial
    repository: https://github.com/eliatra-opensearch-enterprise-distro/geospatial.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - job-scheduler
  - name: cross-cluster-replication
    repository: https://github.com/eliatra-opensearch-enterprise-distro/cross-cluster-replication.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: ml-commons
    repository: https://github.com/eliatra-opensearch-enterprise-distro/ml-commons.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: neural-search
    repository: https://github.com/eliatra-opensearch-enterprise-distro/neural-search.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - ml-commons
      - k-NN
  - name: notifications-core
    repository: https://github.com/eliatra-opensearch-enterprise-distro/notifications.git
    ref: 2.19.x-ee
    working_directory: notifications
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: notifications
    repository: https://github.com/eliatra-opensearch-enterprise-distro/notifications.git
    ref: 2.19.x-ee
    working_directory: notifications
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: opensearch-observability
    repository: https://github.com/eliatra-opensearch-enterprise-distro/observability.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: opensearch-reports
    repository: https://github.com/eliatra-opensearch-enterprise-distro/reporting.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
      - job-scheduler
  - name: sql
    repository: https://github.com/eliatra-opensearch-enterprise-distro/sql.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - ml-commons
  - name: asynchronous-search
    repository: https://github.com/eliatra-opensearch-enterprise-distro/asynchronous-search.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: anomaly-detection
    repository: https://github.com/eliatra-opensearch-enterprise-distro/anomaly-detection.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
      - job-scheduler
  - name: alerting
    repository: https://github.com/eliatra-opensearch-enterprise-distro/alerting.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
  - name: security-analytics
    repository: https://github.com/eliatra-opensearch-enterprise-distro/security-analytics.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
      - alerting
      - job-scheduler
  - name: index-management
    repository: https://github.com/eliatra-opensearch-enterprise-distro/index-management.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
      - job-scheduler
  - name: performance-analyzer
    repository: https://github.com/eliatra-opensearch-enterprise-distro/performance-analyzer.git
    ref: 2.19.x-ee
    platforms:
      - linux
  - name: custom-codecs
    repository: https://github.com/eliatra-opensearch-enterprise-distro/custom-codecs.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: flow-framework
    repository: https://github.com/eliatra-opensearch-enterprise-distro/flow-framework.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - common-utils
      - opensearch-remote-metadata-sdk
  - name: skills
    repository: https://github.com/eliatra-opensearch-enterprise-distro/skills.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
    depends_on:
      - job-scheduler
      - anomaly-detection
      - sql
      - ml-commons
  - name: query-insights
    repository: https://github.com/eliatra-opensearch-enterprise-distro/query-insights.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
  - name: opensearch-system-templates
    repository: https://github.com/eliatra-opensearch-enterprise-distro/opensearch-system-templates.git
    ref: 2.19.x-ee
    platforms:
      - linux
      - windows
